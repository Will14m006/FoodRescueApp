name: food_rescue_backend
description: REST API Food Rescue — auth ber-role (buyer/merchant/admin), katalog surplus, pesanan berkode pick-up.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  # Drift dipakai di server lewat NativeDatabase (bukan drift_flutter).
  drift: ^2.28.0
  sqlite3: ^2.9.0
  # Hash password bcrypt (salt otomatis, cost factor bisa diatur).
  bcrypt: ^1.1.3
  # JWT HS256 untuk sesi + role claim.
  dart_jsonwebtoken: ^3.2.0
  # Pembaca .env — hanya file lokal, tidak pernah di-commit.
  dotenv: ^4.2.0
  # Kode pick-up & id acak yang tidak bisa ditebak.
  uuid: ^4.5.1
  logging: ^1.3.0

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.28.0
  test: ^1.25.8
  lints: ^5.1.1
